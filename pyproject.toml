[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fogids-research"
version = "0.1.0"
description = "Research scaffold for edge/cloud IDS scheduling with iFogSim"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
calibration = ["torch>=2.2", "numpy>=1.24", "pandas>=2.0"]

[project.scripts]
fogids = "fogids.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
